<div class="page">

  <div class="card">

    <h1>Crea account</h1>
    <p class="subtitle">Registrati alla piattaforma Prospettiva</p>

    <form (ngSubmit)="register()" [formGroup]="registerForm">

      <!-- FIRST NAME -->
      <label>First Name</label>
      <div class="input-box" [class.invalid]="isInvalid('firstName')">
        <span class="icon">👤</span>
        <input type="text" formControlName="firstName" placeholder="Mario">
      </div>
      <div class="field-err" *ngIf="isInvalid('firstName')">{{ fieldError('firstName') }}</div>

      <!-- LAST NAME -->
      <label>Last Name</label>
      <div class="input-box" [class.invalid]="isInvalid('lastName')">
        <span class="icon">👤</span>
        <input type="text" formControlName="lastName" placeholder="Rossi">
      </div>
      <div class="field-err" *ngIf="isInvalid('lastName')">{{ fieldError('lastName') }}</div>

      <!-- EMAIL -->
      <label>Email</label>
      <div class="input-box" [class.invalid]="isInvalid('username')">
        <span class="icon">✉</span>
        <input type="email" formControlName="username" placeholder="nome@azienda.it">
      </div>
      <div class="field-err" *ngIf="isInvalid('username')">{{ fieldError('username') }}</div>

      <!-- PASSWORD -->
      <label>Password</label>
      <div class="input-box" [class.invalid]="isInvalid('password')">
        <span class="icon">🔒</span>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>
      <div class="field-err" *ngIf="isInvalid('password')">{{ fieldError('password') }}</div>

      <!-- BUTTON -->
      <button type="submit" [disabled]="loading">
        <span *ngIf="!loading">Registrati →</span>
        <span *ngIf="loading">Registrazione...</span>
      </button>

    </form>

    <div class="footer">
      Hai già un account?
      <a [routerLink]="['/login']">Accedi</a>
    </div>

  </div>

</div>
