<div class="verification-sent-container">
  <div class="verification-card">
    <h2>Email di verifica inviata</h2>
    <p>Ti abbiamo inviato un'email di verifica all'indirizzo fornito durante la registrazione.</p>
    <p>Controlla la tua posta elettronica e clicca sul link per verificare il tuo account.</p>
    <button (click)="resendVerification()" class="resend-button">
      Invia nuovamente l'email
    </button>
  </div>
</div>
