<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container-fluid px-4">
    <!-- Logo/Sito name a sinistra -->
    <a class="navbar-brand fw-bold" routerLink="/">
      Bike Lab
    </a>

    <!-- Toggler per mobile -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenuto navbar -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <!-- Link centrali -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="#servizi">Il nostro servizio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#chi-siamo">Chi siamo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#informazioni">Informazioni</a>
        </li>
      </ul>

      <!-- Pulsanti a destra -->
      <div class="d-flex align-items-center gap-2 position-absolute end-0 me-4">
        <!-- Prenotazione (per ora futura pagina) -->
        <a routerLink="/prenotazione" class="btn btn-primary">Prenotazione</a>

        @if (!isLoggedIn) {
          <a routerLink="/login" class="btn btn-outline-dark">Login</a>
          <a routerLink="/register" class="btn btn-dark">Get Started</a>
        } @else {
          <!-- Avatar con dropdown -->
          <div class="dropdown">
            <button class="btn p-0 border-0 bg-transparent dropdown-toggle avatar-wrapper"
                    type="button"
                    id="userMenuButton"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
              <div class="rounded-circle text-white d-flex align-items-center justify-content-center user-avatar"
                   [title]="userName">
                {{ userInitials }}
              </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenuButton">
              <li>
                <button class="dropdown-item" (click)="goToProfile()">
                  <i class="bi bi-person-circle me-2"></i>
                  Profilo
                </button>
              </li>
              <li>
                <button class="dropdown-item" (click)="goToBookings()">
                  <i class="bi bi-calendar-check me-2"></i>
                  Prenotazioni
                </button>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger logout-item" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>
                  Logout
                </button>
              </li>
            </ul>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
