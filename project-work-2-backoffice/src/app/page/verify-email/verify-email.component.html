<div class="verify-page">
  <div class="verify-card">

    <!-- Loading -->
    <ng-container *ngIf="state === 'loading'">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
      </div>
      <h2>Verifica in corso</h2>
      <p>Stiamo verificando il tuo account...</p>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="state === 'success'">
      <div class="icon-wrapper success">
        <i class="bi bi-check-circle"></i>
      </div>
      <h2>Account verificato!</h2>
      <p>Il tuo account è stato verificato con successo.</p>
      <p class="redirect-hint">Verrai reindirizzato al login tra pochi secondi...</p>
    </ng-container>

    <!-- Error -->
    <ng-container *ngIf="state === 'error'">
      <div class="icon-wrapper error">
        <i class="bi bi-x-circle"></i>
      </div>
      <h2>Verifica fallita</h2>
      <p>{{ errorMessage }}</p>
      <a routerLink="/login" class="btn-link">Vai al login</a>
    </ng-container>

  </div>
</div>
