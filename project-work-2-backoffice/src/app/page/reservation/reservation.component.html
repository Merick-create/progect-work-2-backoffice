<div class="page">
  <div class="container">
    <h1 class="title">Prenota la tua bici</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="card">
      
      <div class="section">
        <h2 class="section-title">Dati ritiro</h2>

        <div class="grid">
          <div class="field">
            <label>Sede</label>
            <select formControlName="pickupLocation">
              <option value="">Seleziona sede</option>
              <option *ngFor="let l of locations" [value]="l.id">{{ l.name }}</option>
            </select>
          </div>

          <div class="field">
            <label>Data ritiro</label>
            <input type="date" formControlName="pickupDate">
          </div>

          <div class="field">
            <label>Orario</label>
            <select formControlName="pickupTime">
              <option value="">Seleziona orario</option>
              <option *ngFor="let s of pickupSlots" [value]="s">{{ s }}</option>
            </select>
          </div>

          <div class="field">
            <label>Data restituzione</label>
            <input type="datetime-local" formControlName="returnDateTime">
          </div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Scegli le bici</h2>

        <div class="bike-grid">
          <div class="bike-card" *ngFor="let bike of availableBikes"
            [class.selected]="selectedBikes.includes(bike.id)"
            (click)="toggleBike(bike.id)">
            <div class="bike-title">{{ bike.code }}</div>
            <div class="bike-info">{{ bike.bikeTypology?.name }} · {{ bike.bikeSize?.name }}</div>
            <div class="bike-footer">
              <span class="status" [class.ok]="bike.available">{{ bike.available ? 'Disponibile' : 'Occupata' }}</span>
            </div>
          </div>
        </div>
        <div class="loading" *ngIf="loading">Caricamento bici disponibili...</div>
      </div>

      <div class="section">
        <h2 class="section-title">Extra</h2>

        <div class="grid">
          <div class="field">
            <label>Accessori</label>
            <select multiple formControlName="accessories">
              <option *ngFor="let a of accessories" [value]="a.id">{{ a.name }}</option>
            </select>
          </div>

          <div class="field">
            <label>Assicurazione</label>
            <select formControlName="insuranceCoverage">
              <option value="">Nessuna</option>
              <option *ngFor="let i of insuranceCoverages" [value]="i.id">{{ i.name }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="submitting">
          {{ submitting ? 'Salvataggio...' : 'Conferma prenotazione' }}
        </button>
      </div>

    </form>
  </div>
</div>
