<div class="bike-typologies-container">
  <h2>Tipologie di Biciclette</h2>

  <!-- Loading -->
  <div *ngIf="!(request$ | async)">
    Caricamento...
  </div>

  <!-- Lista -->
  <ul *ngIf="request$ | async as typologies">
    <li *ngFor="let typology of typologies">
      <strong>{{ typology.name }}</strong>
      - {{ typology.halfDateRate | currency:'EUR':'symbol' }}
    </li>
  </ul>

  <!-- Nessun dato -->
  <p *ngIf="(request$ | async)?.length === 0">
    Nessuna tipologia disponibile.
  </p>
</div>
